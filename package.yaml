name: hugen
version: 0.1.0.0
github: "sawady/hugen"
license: BSD-3-Clause
author: "Federico Sawady"
maintainer: "Federico Sawady"
copyright: "2024–2026 Federico Sawady"
synopsis: A fighting game engine inspired by MUGEN, written in Haskell
category: Game

extra-source-files:
  - README.md
  - CHANGELOG.md

description: Please see the README on GitHub at <https://github.com/sawady/hugen#readme>

language: Haskell2010

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

# The core is a separate library on purpose: it only depends on base and
# containers, so the simulation cannot touch SDL, the clock or IO. The build
# enforces the boundary described in docs/design.md.
internal-libraries:
  hugen-core:
    source-dirs: src/core
    dependencies:
      - base >= 4.7 && < 5
      - containers

library:
  source-dirs: src/shell
  dependencies:
    - base >= 4.7 && < 5
    - hugen-core
    - sdl2
    - sdl2-image
    - text
    - mtl
    - linear
    - lens
    - containers
    - config-ini

executables:
  hugen:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base >= 4.7 && < 5
      - hugen
      - hugen-core

tests:
  hugen-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base >= 4.7 && < 5
      - hugen-core
      - containers
      - hspec
      - QuickCheck
